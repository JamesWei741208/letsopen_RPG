<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>letsopen-RPG｜開店冒險</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f0f1a;
      --panel: #1a1a2e;
      --panel2: #16213e;
      --border: #4a4a6a;
      --gold: #f5a623;
      --gold-dark: #e8930d;
      --text: #e8e8d0;
      --muted: #888888;
      --green: #27ae60;
      --green2: #2ecc71;
      --red: #e74c3c;
      --white: #ffffff;

      --fs-xs: clamp(12px, 1.8vw, 15px);
      --fs-sm: clamp(14px, 2.2vw, 18px);
      --fs-md: clamp(16px, 2.6vw, 22px);
      --fs-lg: clamp(18px, 3vw, 26px);
      --fs-xl: clamp(22px, 4vw, 34px);

      --gap-sm: clamp(10px, 1.5vw, 16px);
      --gap-md: clamp(14px, 2.2vw, 24px);
      --gap-lg: clamp(20px, 3vw, 36px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--gap-lg) var(--gap-md) 80px;
      font-family: 'Press Start 2P', monospace;
      color: var(--text);
    }

    /* ── 登入頁面 ── */
    #login-screen {
      width: 100%;
      max-width: 480px;
      text-align: center;
      padding-top: 10vh;
    }
    .login-title {
      font-size: var(--fs-xl);
      color: var(--gold);
      margin-bottom: var(--gap-sm);
      line-height: 1.6;
    }
    .login-sub {
      font-size: var(--fs-xs);
      color: var(--muted);
      line-height: 2.4;
      margin-bottom: var(--gap-lg);
    }
    .login-box {
      background: var(--panel);
      border: 3px solid var(--border);
      padding: var(--gap-lg);
    }
    .login-box-title {
      font-size: var(--fs-sm);
      color: var(--text);
      margin-bottom: var(--gap-md);
      line-height: 1.8;
    }
    .google-btn {
      width: 100%;
      background: var(--white);
      border: 3px solid #ccc;
      color: #1a1a2e;
      font-family: 'Press Start 2P', monospace;
      font-size: var(--fs-sm);
      padding: var(--gap-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--gap-sm);
      transition: border-color .15s, background .15s;
      line-height: 1.8;
    }
    .google-btn:hover { border-color: var(--gold); background: #fff9ee; }
    .google-icon { font-size: 20px; flex-shrink: 0; }
    .login-note {
      font-size: var(--fs-xs);
      color: var(--muted);
      margin-top: var(--gap-md);
      line-height: 2.2;
    }

    /* ── 頂部 Header（登入後） ── */
    #site-header {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--gap-lg);
      flex-wrap: wrap;
      gap: var(--gap-sm);
    }
    .site-title {
      font-size: var(--fs-lg);
      color: var(--gold);
    }
    .user-bar {
      display: flex;
      align-items: center;
      gap: var(--gap-sm);
    }
    .user-name {
      font-size: var(--fs-xs);
      color: var(--muted);
    }
    .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Press Start 2P', monospace;
      font-size: var(--fs-xs);
      padding: 6px 12px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    /* ── 主容器 ── */
    #app {
      width: 100%;
      max-width: 700px;
      background: var(--panel);
      border: 3px solid var(--border);
      padding: var(--gap-lg);
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      gap: var(--gap-sm);
      background: var(--panel2);
      border: 2px solid var(--border);
      padding: var(--gap-md);
      margin-bottom: var(--gap-md);
      flex-wrap: wrap;
    }
    .topbar-left { flex: 1; min-width: 0; }
    .quest-label { font-size: var(--fs-xs); color: var(--gold); margin-bottom: 8px; }
    .quest-title { font-size: var(--fs-md); color: var(--text); line-height: 1.6; }
    .time-pill {
      font-size: var(--fs-xs);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      white-space: nowrap;
      align-self: flex-start;
    }

    .progress-wrap {
      display: flex;
      gap: var(--gap-sm);
      align-items: center;
      margin-bottom: var(--gap-md);
    }
    .pip {
      flex: 1;
      height: clamp(7px, 1.2vw, 11px);
      background: #333;
      border: 1px solid #444;
    }
    .pip.done { background: var(--gold); }
    .pip.active { background: var(--gold); animation: pulse 1s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: 0.5 } to { opacity: 1 } }
    .prog-txt { font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; flex-shrink: 0; }

    .dialog {
      background: var(--panel2);
      border: 3px solid var(--text);
      padding: var(--gap-md);
      margin-bottom: var(--gap-md);
    }
    .speaker { font-size: var(--fs-sm); color: var(--gold); margin-bottom: var(--gap-sm); }
    .dtext { font-size: var(--fs-sm); line-height: 2.6; color: var(--text); }
    .cursor {
      display: inline-block;
      width: 0.65em; height: 1.1em;
      background: var(--text);
      animation: blink .8s step-end infinite;
      vertical-align: middle;
      margin-left: 3px;
    }
    @keyframes blink { 50% { opacity: 0 } }

    .choices { display: flex; flex-direction: column; gap: var(--gap-sm); margin-bottom: var(--gap-sm); }
    .cbtn {
      background: var(--white);
      border: 3px solid #ccc;
      color: #1a1a2e;
      font-family: 'Press Start 2P', monospace;
      font-size: var(--fs-sm);
      padding: var(--gap-md);
      cursor: pointer;
      text-align: left;
      transition: border-color .15s, background .15s;
      line-height: 2;
      display: flex;
      align-items: flex-start;
      gap: var(--gap-sm);
    }
    .cbtn:hover { border-color: var(--gold); background: #fff9ee; }
    .cbtn.selected { border-color: var(--gold); background: var(--gold); color: #1a1a2e; }
    .cbtn.selected .carr { color: #1a1a2e; }
    .carr { color: var(--gold); font-size: var(--fs-md); flex-shrink: 0; margin-top: 2px; }

    .irow { display: flex; gap: var(--gap-sm); margin-bottom: var(--gap-sm); flex-wrap: wrap; }
    .pinput {
      flex: 1; min-width: 200px;
      background: var(--white);
      border: 3px solid #ccc;
      color: #1a1a2e;
      font-family: 'Press Start 2P', monospace;
      font-size: var(--fs-sm);
      padding: var(--gap-md);
      outline: none;
    }
    .pinput:focus { border-color: var(--gold); }
    .pinput::placeholder { color: #bbb; }

    .pbtn {
      background: var(--gold);
      border: none;
      color: #1a1a2e;
      font-family: 'Press Start 2P', monospace;
      font-size: var(--fs-sm);
      padding: var(--gap-md) var(--gap-lg);
      cursor: pointer;
      white-space: nowrap;
      transition: background .1s;
    }
    .pbtn:hover { background: var(--gold-dark); }

    .toast {
      background: var(--green);
      border: 2px solid var(--green2);
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: var(--fs-xs);
      padding: var(--gap-sm) var(--gap-md);
      margin-bottom: var(--gap-sm);
      animation: slideIn .3s ease;
      line-height: 2.2;
    }
    @keyframes slideIn {
      from { transform: translateY(-8px); opacity: 0 }
      to   { transform: translateY(0); opacity: 1 }
    }

    .profile-card {
      background: var(--panel2);
      border: 3px solid var(--gold);
      padding: var(--gap-lg);
    }
    .pc-title { font-size: var(--fs-md); color: var(--gold); margin-bottom: var(--gap-lg); text-align: center; }
    .pc-row {
      display: flex; align-items: flex-start; gap: var(--gap-md);
      margin-bottom: var(--gap-md); padding-bottom: var(--gap-md);
      border-bottom: 1px solid #2a2a4a;
    }
    .pc-row:last-of-type { border-bottom: none; }
    .pc-lbl { font-size: var(--fs-xs); color: var(--muted); min-width: clamp(64px, 10vw, 96px); flex-shrink: 0; line-height: 2.2; }
    .pc-val { font-size: var(--fs-sm); color: var(--text); line-height: 2.2; flex: 1; }
    .pc-badge { display: inline-block; background: var(--gold); color: #1a1a2e; font-size: var(--fs-xs); padding: 4px 12px; margin-top: 8px; }

    .reward-box {
      background: #0d2b1a; border: 2px solid var(--green);
      padding: var(--gap-lg); margin-top: var(--gap-md); text-align: center;
    }
    .reward-title { font-size: var(--fs-sm); color: var(--green2); margin-bottom: var(--gap-md); }
    .xp-big { font-size: clamp(28px, 5vw, 44px); color: var(--gold); }
    .xp-sub { font-size: var(--fs-xs); color: var(--muted); margin-top: 8px; }
    .badge-row { display: flex; justify-content: center; gap: var(--gap-sm); margin-top: var(--gap-md); flex-wrap: wrap; }
    .badge {
      background: var(--panel2); border: 2px solid var(--gold);
      font-size: var(--fs-xs); color: var(--gold);
      padding: var(--gap-sm) var(--gap-md); text-align: center; line-height: 2;
    }

    .next-btn {
      width: 100%; background: var(--gold); border: none;
      color: #1a1a2e; font-family: 'Press Start 2P', monospace;
      font-size: var(--fs-md); padding: var(--gap-md);
      cursor: pointer; margin-top: var(--gap-md);
      transition: background .1s; line-height: 1.8;
    }
    .next-btn:hover { background: var(--gold-dark); }

    .coming-soon {
      background: var(--panel2); border: 3px solid var(--border);
      padding: var(--gap-lg); text-align: center; margin-top: 4px;
    }
    .cs-icon { font-size: clamp(40px, 7vw, 60px); margin-bottom: var(--gap-md); }
    .cs-title { font-size: var(--fs-lg); color: var(--gold); margin-bottom: var(--gap-md); }
    .cs-desc { font-size: var(--fs-sm); color: var(--muted); line-height: 2.6; }

    /* ── Loading ── */
    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: var(--gap-md);
    }
    .loading-txt { font-size: var(--fs-sm); color: var(--gold); animation: pulse 1s ease-in-out infinite alternate; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 載入中 -->
  <div id="loading-screen">
    <div class="loading-txt">🏪 載入中...</div>
  </div>

  <!-- 登入畫面 -->
  <div id="login-screen" class="hidden">
    <div class="login-title">🏪 letsopen-RPG</div>
    <div class="login-sub">從零開始・手把手・帶你開店</div>
    <div class="login-box">
      <div class="login-box-title">登入開始你的<br>開店冒險旅程</div>
      <button class="google-btn" onclick="loginWithGoogle()">
        用 <svg width="20" height="20" viewBox="0 0 48 48" style="flex-shrink:0;vertical-align:middle;margin:0 2px"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.33 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-3.58-13.46-8.91l-7.98 6.19C6.51 42.67 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg> Google 帳號登入
      </button>
      <div class="login-note">登入後可儲存進度<br>隨時繼續你的冒險</div>
    </div>
  </div>

  <!-- 遊戲畫面 -->
  <div id="game-screen" class="hidden" style="width:100%;max-width:700px;">
    <div id="site-header">
      <div class="site-title">🏪 letsopen-RPG</div>
      <div class="user-bar">
        <div class="user-name" id="user-name">載入中...</div>
        <button class="logout-btn" onclick="logout()">登出</button>
      </div>
    </div>

    <div id="app">
      <div class="topbar">
        <div class="topbar-left">
          <div class="quest-label">第一章・夢想定位</div>
          <div class="quest-title">關卡 1：認識你自己</div>
        </div>
        <div class="time-pill">⏱ 約 30 分鐘</div>
      </div>

      <div class="progress-wrap">
        <div class="pip active" id="p0"></div>
        <div class="pip" id="p1"></div>
        <div class="pip" id="p2"></div>
        <div class="pip" id="p3"></div>
        <div class="pip" id="p4"></div>
        <span class="prog-txt" id="prog-txt">問題 1 / 5</span>
      </div>

      <div id="toast-area"></div>

      <div class="dialog">
        <div class="speaker" id="speaker">村長 老王</div>
        <div class="dtext" id="dtext">
          勇者，歡迎來到開店冒險！<br>
          在我們出發之前，<br>
          讓我先認識一下你吧。<br>
          你希望我怎麼稱呼你？
          <span class="cursor"></span>
        </div>
      </div>

      <div id="action-area"></div>
    </div>
  </div>

  <script>
    // ── Supabase 初始化 ──
    const SUPABASE_URL = 'https://dwcevlrzwqngkmdguijw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3Y2V2bHJ6d3FuZ2ttZGd1aWp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMjk0MTcsImV4cCI6MjA5MjYwNTQxN30.qXqgMp0DUw-iyRy6r6Lszh7r5GDbMLqZft5e1VUH8b4';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    const G = { name:'', status:'', exp:'', reason:'', strength:'', xp:0 };

    // ── 登入/登出 ──
    async function loginWithGoogle() {
      await db.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: 'https://letsopen-rpg.vercel.app' }
      });
    }

    async function logout() {
      await db.auth.signOut();
      location.reload();
    }

    // ── 儲存進度 ──
    async function saveProgress() {
      if (!currentUser) return;
      await db.from('user_progress').upsert({
        user_id: currentUser.id,
        current_quest: 1,
        xp: G.xp,
        profile: {
          name: G.name,
          status: G.status,
          exp: G.exp,
          reason: G.reason,
          strength: G.strength
        },
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });
    }

    // ── 讀取進度 ──
    async function loadProgress() {
      if (!currentUser) return null;
      try {
        const { data, error } = await db
          .from('user_progress')
          .select('*')
          .eq('user_id', currentUser.id)
          .maybeSingle();
        if (error) { console.log('loadProgress error', error); return null; }
        return data;
      } catch(e) {
        console.log('loadProgress exception', e);
        return null;
      }
    }

    // ── 畫面切換 ──
    function showScreen(name) {
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById(name + '-screen').classList.remove('hidden');
    }

    // ── 初始化 ──
    async function startGame(session) {
      try {
        console.log('startGame called', session.user.email);
        currentUser = session.user;
        const email = currentUser.email || '';
        const displayName = currentUser.user_metadata?.full_name || email.split('@')[0];
        document.getElementById('user-name').textContent = displayName;

        const progress = await loadProgress();
        console.log('progress loaded', progress);
        if (progress?.profile?.name) {
          G.name = progress.profile.name;
          G.status = progress.profile.status || '';
          G.exp = progress.profile.exp || '';
          G.reason = progress.profile.reason || '';
          G.strength = progress.profile.strength || '';
          G.xp = progress.xp || 0;
        }

        console.log('showing game screen');
        showScreen('game');
        setTimeout(() => step0(), 100);
      } catch (e) {
        console.error('startGame error', e);
        showScreen('login');
      }
    }

    // 啟動
    window.addEventListener('load', async () => {
      console.log('page loaded, starting init');

      // 最多等 4 秒
      const t = setTimeout(() => {
        console.log('timeout!');
        showScreen('login');
      }, 4000);

      try {
        // 先檢查現有 session
        const { data: { session }, error } = await db.auth.getSession();
        console.log('getSession done', session?.user?.email, error);
        clearTimeout(t);

        if (session) {
          await startGame(session);
        } else {
          showScreen('login');
        }

        // 再監聽之後的狀態變化
        db.auth.onAuthStateChange(async (event, session) => {
          console.log('auth change:', event, session?.user?.email);
          if (event === 'SIGNED_IN' && session) {
            await startGame(session);
          } else if (event === 'SIGNED_OUT') {
            location.reload();
          }
        });

      } catch(e) {
        console.error('init error:', e);
        clearTimeout(t);
        showScreen('login');
      }
    });
  </script>
</body>
</html>
